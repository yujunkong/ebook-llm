<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>Why attention</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 35-1. 정보 도달: RNN hops vs Attention 1-hop</text>
  <text x="60" y="96" font-size="18" fill="#555">T=8, 위치1 → 위치8</text>
  <text x="80" y="180" font-size="22" font-family="Georgia, serif" fill="#b35c00">RNN: 1→2→3→4→5→6→7→8 (7 hops)</text>
  <g stroke="#b35c00" stroke-width="3" fill="#b35c00">
    <circle cx="120" cy="240" r="14"/><circle cx="220" cy="240" r="14"/>
    <circle cx="320" cy="240" r="14"/><circle cx="420" cy="240" r="14"/>
    <circle cx="520" cy="240" r="14"/><circle cx="620" cy="240" r="14"/>
    <circle cx="720" cy="240" r="14"/><circle cx="820" cy="240" r="14"/>
    <line x1="134" y1="240" x2="206" y2="240"/>
    <line x1="234" y1="240" x2="306" y2="240"/>
    <line x1="334" y1="240" x2="406" y2="240"/>
    <line x1="434" y1="240" x2="506" y2="240"/>
    <line x1="534" y1="240" x2="606" y2="240"/>
    <line x1="634" y1="240" x2="706" y2="240"/>
    <line x1="734" y1="240" x2="806" y2="240"/>
  </g>
  <text x="80" y="360" font-size="22" font-family="Georgia, serif" fill="#0b6e4f">Self-Attention: 1 ↔ 8 직접 점수 (1 hop)</text>
  <g stroke="#0b6e4f" stroke-width="3" fill="#0b6e4f">
    <circle cx="120" cy="420" r="14"/><circle cx="820" cy="420" r="14"/>
    <path d="M140 410 Q470 320 800 410" fill="none"/>
  </g>
  <text x="80" y="520" font-size="18" fill="#555">연결성 이야기(성능 보장 아님). 긴 의존에 Attention이 끌린 출발점.</text>

