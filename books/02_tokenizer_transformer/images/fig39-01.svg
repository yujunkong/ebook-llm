<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>Self attention</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 39-1. Self-Attention: X→Q,K,V → O</text>
  <text x="60" y="96" font-size="18" fill="#555">같은 X에서 Q,K,V를 만들고, 출력을 다시 X 공간으로</text>
  <rect x="100" y="200" width="200" height="100" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
  <text x="160" y="260" font-size="24">X</text>
  <text x="330" y="230" font-size="20">W_Q</text>
  <text x="330" y="270" font-size="20">W_K</text>
  <text x="330" y="310" font-size="20">W_V</text>
  <text x="420" y="260" font-size="28">→</text>
  <rect x="480" y="160" width="120" height="60" rx="6" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="520" y="200" font-size="20">Q</text>
  <rect x="480" y="240" width="120" height="60" rx="6" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="520" y="280" font-size="20">K</text>
  <rect x="480" y="320" width="120" height="60" rx="6" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="520" y="360" font-size="20">V</text>
  <text x="640" y="260" font-size="28">→</text>
  <rect x="700" y="200" width="360" height="160" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="730" y="270" font-size="18">softmax(QKᵀ/√d) V</text>
  <text x="730" y="320" font-size="18" fill="#555">→ O → (×W_O)</text>

</svg>
