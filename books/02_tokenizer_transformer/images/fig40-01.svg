  <rect x="120" y="420" width="960" height="180" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="150" y="480" font-size="20">Softmax(−∞)=0 → 미래 위치 가중치 0</text>
  <text x="150" y="530" font-size="18" fill="#555">학습 목표 “다음 토큰 맞히기”와 같은 방향의 정보를 막음</text>

