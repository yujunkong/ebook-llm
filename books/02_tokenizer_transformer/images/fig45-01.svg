<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>FFN</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 45-1. FFN: d → 4d → d (토큰별 MLP)</text>
  <text x="60" y="96" font-size="18" fill="#555">x=[1,2], W1로 확장 → ReLU → W2로 축소</text>
  <rect x="80" y="220" width="180" height="100" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
  <text x="110" y="280" font-size="20">x (d=2)</text>
  <text x="280" y="270" font-size="24">→</text>
  <rect x="320" y="220" width="220" height="100" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="350" y="270" font-size="18">[1,2,1,0] (4d)</text>
  <text x="350" y="295" font-size="14" fill="#555">ReLU 후</text>
  <text x="560" y="270" font-size="24">→</text>
  <rect x="600" y="220" width="220" height="100" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="640" y="280" font-size="20">y (d=2)</text>
  <text x="100" y="420" font-size="18" fill="#555">Attention이 섞은 뒤, FFN이 각 위치의 내용을 비선형 변환</text>

</svg>
