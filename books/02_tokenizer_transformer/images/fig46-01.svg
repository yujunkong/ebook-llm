<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>Transformer block</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 46-1. Transformer Block (Pre-LN)</text>
  <text x="60" y="96" font-size="18" fill="#555">x → LN → MHA → +x → LN → FFN → +x</text>
  <rect x="400" y="140" width="400" height="60" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
  <text x="560" y="180" font-size="20">x</text>
  <text x="580" y="220" font-size="20">↓</text>
  <rect x="400" y="240" width="400" height="50" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="520" y="275" font-size="18">LN₁ → MHA</text>
  <text x="580" y="310" font-size="20">↓ +x</text>
  <rect x="400" y="330" width="400" height="50" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="520" y="365" font-size="18">LN₂ → FFN</text>
  <text x="580" y="400" font-size="20">↓ +x</text>
  <rect x="400" y="420" width="400" height="60" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
  <text x="540" y="460" font-size="20">block out</text>
  <text x="100" y="560" font-size="18" fill="#555">이 블록을 N번 쌓으면 GPT류 backbone. Causal mask는 MHA 안.</text>

</svg>
