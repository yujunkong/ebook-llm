<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <title>Softmax bar chart</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 33-1. Softmax: logits → 합이 1인 확률</text>
  <text x="60" y="96" font-size="18" fill="#555">z=[2.0, 1.0, 0.1] → exp → 정규화</text>
  <!-- bars logits -->
  <text x="100" y="160" font-size="20" font-family="Georgia, serif">logits z</text>
  <rect x="100" y="200" width="200" height="40" fill="#1d4e89"/>
  <rect x="100" y="260" width="100" height="40" fill="#1d4e89" opacity="0.7"/>
  <rect x="100" y="320" width="40" height="40" fill="#1d4e89" opacity="0.45"/>
  <text x="320" y="228" font-size="18">2.0</text>
  <text x="220" y="288" font-size="18">1.0</text>
  <text x="160" y="348" font-size="18">0.1</text>
  <text x="520" y="280" font-size="36" fill="#b35c00">→</text>
  <text x="700" y="160" font-size="20" font-family="Georgia, serif">확률 p</text>
  <rect x="700" y="200" width="265" height="40" fill="#0b6e4f"/>
  <rect x="700" y="260" width="97" height="40" fill="#0b6e4f" opacity="0.75"/>
  <rect x="700" y="320" width="39" height="40" fill="#0b6e4f" opacity="0.5"/>
  <text x="980" y="228" font-size="18">0.66</text>
  <text x="820" y="288" font-size="18">0.24</text>
  <text x="760" y="348" font-size="18">0.10</text>
  <rect x="100" y="420" width="1000" height="180" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="130" y="470" font-size="20">계산: e²≈7.39, e¹≈2.72, e⁰·¹≈1.11 → 합≈11.22</text>
  <text x="130" y="520" font-size="20">p₀=7.39/11.22≈0.66,  p₁≈0.24,  p₂≈0.10  (합=1)</text>
  <text x="130" y="570" font-size="18" fill="#555">LLM: vocab 크기 V개 logit에 같은 연산 → 다음 토큰 분포</text>

</svg>
