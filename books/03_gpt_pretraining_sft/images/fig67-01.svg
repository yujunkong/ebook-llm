<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <rect width="1200" height="680" fill="#f7f4ef"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 67-1. Perplexity = exp(평균 NLL)</text>
  <text x="60" y="96" font-size="18" fill="#555">평균 NLL = 2.3 nats/token → PPL ≈ 10</text>
  <circle cx="350" cy="320" r="120" fill="#fff" stroke="#0b6e4f" stroke-width="4"/>
  <text x="300" y="310" font-size="22">NLL</text>
  <text x="295" y="350" font-size="28" font-family="Georgia, serif">2.3</text>
  <text x="520" y="330" font-size="40" fill="#b35c00">→</text>
  <circle cx="750" cy="320" r="120" fill="#fff" stroke="#1d4e89" stroke-width="4"/>
  <text x="700" y="310" font-size="22">PPL</text>
  <text x="710" y="350" font-size="28" font-family="Georgia, serif">≈10</text>
  <rect x="80" y="500" width="1040" height="120" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="570" font-size="20">직관: “매 토큰 평균 10지선다처럼 헷갈린다” (거친 해석)</text>
</svg>