<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <rect width="1200" height="680" fill="#f7f4ef"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 58-1. Greedy vs Sampling</text>
  <text x="60" y="96" font-size="18" fill="#555">p = [0.50, 0.30, 0.20] over {A,B,C}</text>
  <rect x="80" y="150" width="480" height="220" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="100" y="195" font-size="22" font-family="Georgia, serif" fill="#0b6e4f">Greedy</text>
  <text x="100" y="245" font-size="20">argmax → 항상 A</text>
  <text x="100" y="295" font-size="18" fill="#555">시드와 무관, 결정적</text>
  <rect x="620" y="150" width="480" height="220" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
  <text x="640" y="195" font-size="22" font-family="Georgia, serif" fill="#1d4e89">Sampling</text>
  <text x="640" y="245" font-size="20">Categorical(p)</text>
  <text x="640" y="295" font-size="18" fill="#555">A≈50%, B≈30%, C≈20%</text>
  <rect x="80" y="420" width="1040" height="180" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="480" font-size="20">10번 뽑으면 Greedy: AAAAAAAAAA</text>
  <text x="110" y="535" font-size="20">Sample 예: A B A A C A B A A A  (매번 다를 수 있음)</text>
</svg>