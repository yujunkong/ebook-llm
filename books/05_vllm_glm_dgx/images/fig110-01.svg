<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <rect width="1200" height="680" fill="#f7f4ef"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 110-1. Speculative decoding speedup</text>
  <text x="60" y="96" font-size="18" fill="#555">γ=5 draft, α=0.7 accept, c=0.2 verify cost</text>
  <rect x="100" y="180" width="1000" height="120" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
  <text x="130" y="250" font-size="22">speedup ≈ (1 + γα) / (1 + c) = (1+3.5)/(1.2) ≈ 3.75</text>
  <rect x="80" y="360" width="1040" height="240" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="420" font-size="20">tokens/round ≈ 1 + αγ = 1 + 0.7·5 = 4.5</text>
  <text x="110" y="480" font-size="20">초안을 많이 맞춰야(α↑) 이득; 검증이 비싸면(c↑) 이득↓</text>
  <text x="110" y="550" font-size="18" fill="#555">직관: 값싼 작은 모델이 제안 → 큰 모델이 한 번에 검증</text>
</svg>