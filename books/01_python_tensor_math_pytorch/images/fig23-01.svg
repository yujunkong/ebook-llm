<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>SGD step</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 23-1. 학습 스텝: zero → fwd → loss → bwd → step</text>
  <text x="60" y="96" font-size="18" fill="#555">θ=2.0, g=0.5, η=0.1 → θ′=1.95</text>
  <g font-size="18" font-family="Helvetica, Arial, sans-serif">
    <rect x="60" y="200" width="180" height="80" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
    <text x="90" y="250">1 zero_grad</text>
    <text x="255" y="245" font-size="24">→</text>
    <rect x="290" y="200" width="160" height="80" rx="8" fill="#fff" stroke="#1d4e89" stroke-width="2"/>
    <text x="320" y="250">2 forward</text>
    <text x="465" y="245" font-size="24">→</text>
    <rect x="500" y="200" width="140" height="80" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
    <text x="535" y="250">3 loss</text>
    <text x="655" y="245" font-size="24">→</text>
    <rect x="690" y="200" width="160" height="80" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
    <text x="710" y="250">4 backward</text>
    <text x="865" y="245" font-size="24">→</text>
    <rect x="900" y="200" width="160" height="80" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
    <text x="940" y="250">5 step</text>
  </g>
  <rect x="200" y="360" width="800" height="220" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="240" y="430" font-size="24" font-family="Georgia, serif">θ ← θ − η g = 2.0 − 0.1×0.5 = 1.95</text>
  <text x="240" y="490" font-size="18" fill="#555">zero_grad 빠지면 g가 누적(0.5+0.5=1.0) → θ=1.9 로 과대 갱신</text>
  <text x="240" y="540" font-size="18" fill="#0b6e4f">Adam은 성분마다 보폭을 조절할 뿐, 뼈대는 동일</text>

</svg>
