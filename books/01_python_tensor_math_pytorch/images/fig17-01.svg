<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
  <title>Backprop deltas</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 17-1. Backward: δ를 위로 흘리기</text>
  <text x="60" y="96" font-size="18" fill="#555">ŷ=0.21, y=1 → ∂L/∂ŷ=−0.79 → 출력·은닉 Weight로 전파</text>
  <rect x="80" y="160" width="1040" height="100" rx="8" fill="#fff" stroke="#b35c00" stroke-width="2"/>
  <text x="120" y="220" font-size="22" font-family="Georgia, serif">δ² = ∂L/∂ŷ = −0.79  →  ∂L/∂b²=−0.79,  ∂L/∂W²=[−0.237, −0.2765]</text>
  <text x="560" y="300" font-size="28">↓</text>
  <rect x="80" y="330" width="1040" height="100" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="2"/>
  <text x="120" y="380" font-size="20">∂L/∂a¹ = [−0.395, 0.316]  → ReLU′=1 → δ¹ 동일</text>
  <text x="120" y="410" font-size="18" fill="#555">∂L/∂W¹ = δ¹ xᵀ = [[−0.395,−0.1975],[0.316,0.158]]</text>
  <rect x="200" y="500" width="800" height="140" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="240" y="560" font-size="20">η=0.1이면 b² ← 0.2 − 0.1(−0.79) = 0.279</text>
  <text x="240" y="600" font-size="18" fill="#555">부호: ∂L/∂ŷ&lt;0 → ŷ를 키우는 쪽 파라미터가 강화</text>

</svg>
