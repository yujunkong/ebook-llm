<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <rect width="1200" height="680" fill="#f7f4ef"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 86-1. RLHF 파이프라인 숫자</text>
  <text x="80" y="140" font-size="18">SFT → RM → PPO</text>
  <rect x="80" y="180" width="300" height="100" rx="8" fill="#1d4e89"/><text x="160" y="240" fill="#fff" font-size="20">SFT π_ref</text>
  <text x="400" y="240" font-size="28" fill="#b35c00">→</text>
  <rect x="450" y="180" width="300" height="100" rx="8" fill="#0b6e4f"/><text x="520" y="240" fill="#fff" font-size="20">RM r_φ</text>
  <text x="770" y="240" font-size="28" fill="#b35c00">→</text>
  <rect x="820" y="180" width="280" height="100" rx="8" fill="#b35c00"/><text x="880" y="240" fill="#fff" font-size="20">PPO π_θ</text>
  <rect x="80" y="340" width="1040" height="260" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="400" font-size="20">R = r_φ − β KL ,  예: r=1.2, β=0.1, log(π/π_ref)=0.8</text>
  <text x="110" y="460" font-size="20">R = 1.2 − 0.1·0.8 = 1.12</text>
  <text x="110" y="530" font-size="18" fill="#555">보상은 올리되 참조 정책에서 너무 멀어지지 않게</text>
</svg>