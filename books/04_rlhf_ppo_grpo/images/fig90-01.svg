<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img">
  <title>DPO preference pair</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f7f4ef"/>

  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 90-1. DPO: 선호쌍 (y_w ≻ y_l) 로 직접 학습</text>
  <rect x="80" y="140" width="420" height="280" rx="8" fill="#fff" stroke="#0b6e4f" stroke-width="3"/>
  <text x="110" y="190" font-size="22" fill="#0b6e4f">y_w (선호)</text>
  <text x="110" y="240" font-size="18">“수도는 서울입니다.”</text>
  <text x="110" y="300" font-size="16" fill="#555">π가 이 답을 더 크게</text>
  <rect x="560" y="140" width="420" height="280" rx="8" fill="#fff" stroke="#b35c00" stroke-width="3"/>
  <text x="590" y="190" font-size="22" fill="#b35c00">y_l (비선호)</text>
  <text x="590" y="240" font-size="18">“잘 모르겠어요ㅎㅎ”</text>
  <text x="590" y="300" font-size="16" fill="#555">π가 이 답을 상대적으로 작게</text>
  <text x="1000" y="280" font-size="36">≻</text>
  <rect x="80" y="460" width="1040" height="120" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="510" font-size="18">손실 직관:  log(π/π_ref) 의 (선호 − 비선호) 마진을 키운다 (β로 강도 조절)</text>
  <text x="110" y="550" font-size="16" fill="#555">별도 Reward Model 없이 선호 데이터만으로 정책 갱신</text>

</svg>
