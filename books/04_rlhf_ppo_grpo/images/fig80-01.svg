<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img">
  <rect width="1200" height="680" fill="#f7f4ef"/>
  <text x="60" y="56" font-family="Georgia, serif" font-size="28" fill="#1a1a1a">Fig 80-1. LLM을 MDP로 보면</text>
  <text x="60" y="96" font-size="18" fill="#555">s_t = (prompt, y_&lt;t), a_t = 다음 토큰, r 마지막에</text>
  <rect x="80" y="160" width="200" height="90" rx="8" fill="#1d4e89"/><text x="120" y="215" fill="#fff" font-size="20">s0 prompt</text>
  <text x="300" y="215" font-size="28" fill="#b35c00">→</text>
  <rect x="340" y="160" width="160" height="90" rx="8" fill="#0b6e4f"/><text x="380" y="215" fill="#fff" font-size="20">a0=안녕</text>
  <text x="520" y="215" font-size="28" fill="#b35c00">→</text>
  <rect x="560" y="160" width="200" height="90" rx="8" fill="#1d4e89"/><text x="600" y="215" fill="#fff" font-size="20">s1 +token</text>
  <text x="780" y="215" font-size="28" fill="#b35c00">→</text>
  <rect x="820" y="160" width="160" height="90" rx="8" fill="#0b6e4f"/><text x="860" y="215" fill="#fff" font-size="20">a1=하세요</text>
  <rect x="80" y="320" width="1040" height="280" rx="8" fill="#fff" stroke="#d0cbc3"/>
  <text x="110" y="380" font-size="20">예: γ=0.9, 보상 r=[0,0,5] (마지막에만 +5)</text>
  <text x="110" y="440" font-size="20">G0 = 0 + 0.9·0 + 0.9²·5 = 4.05</text>
  <text x="110" y="500" font-size="20">G1 = 0 + 0.9·5 = 4.5 ,  G2 = 5</text>
  <text x="110" y="560" font-size="18" fill="#555">직관: 지금 토큰도 “나중에 받을 보상”의 몫을 갖는다</text>
</svg>